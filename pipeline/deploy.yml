name: CI / Deploy

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need (build: packages: write).
permissions:
  contents: read

jobs:

  # ─── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

  # ─── 2. Build & push image ──────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # push to GHCR via GITHUB_TOKEN
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # The one place the deploy tag is defined: metadata-action and the deploy job both use it.
      - id: tag
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Never push :latest — deploys always use the explicit sha tag.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ─── 3. Deploy (requires manual approval via environment protection rule) ───
  deploy:
    name: Deploy to production
    needs: build
    # Only a release tag (push) or main (workflow_dispatch) may reach production;
    # a manual run on any other branch still tests and builds, but does not deploy.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    # Never cancel an in-flight production deploy; tests and builds of other runs stay parallel.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # → Settings › Environments › production: add required reviewers
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # All DEPLOY_* secrets are read here once and turned into the ssh host alias `prod`;
      # the steps below are plain scp/ssh. DEPLOY_KNOWN_HOSTS = `ssh-keyscan -p <port> <host>`
      # output checked by hand once — the host key is verified, not trusted on first use.
      - name: Configure SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # metadata-action pushes a lowercase image name; pull exactly that.
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Push the latest compose file to the server.
      - name: Upload compose file
        run: scp deploy/compose.yaml prod:/opt/poshtomat/compose.yaml

      # Pull the new image and recreate containers (short downtime while compose recreates them).
      # GHCR_TOKEN is a PAT with packages:read scope, stored in repo secrets. It goes to the
      # remote docker login through stdin (never as a CLI arg), so it does not appear in the
      # remote process list or shell history.
      - name: Pull image and restart services
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh prod "set -eu
            cd /opt/poshtomat
            export IMAGE='$IMAGE' IMAGE_TAG='$IMAGE_TAG'
            docker compose pull --quiet api worker
            docker compose up -d --remove-orphans --no-build
            docker image prune -f"
