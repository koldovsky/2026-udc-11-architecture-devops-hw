name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default: read-only. Jobs that need more opt in explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: node --test

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # Requires a reviewer approval configured under Settings → Environments → production
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/compose.yaml
          target: /opt/poshtomat/
          strip_components: 1   # drops the "deploy/" prefix

      - name: Pull new image and restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE
          # DATABASE_URL and SMS_TOKEN stay in /opt/poshtomat/.env on the VM (outside git);
          # compose refuses to start without them (${VAR:?…}).
          script: |
            set -eu
            cd /opt/poshtomat
            test -n "$IMAGE"

            # record the deployed image in .env (replace the line, or add it if missing)
            if grep -q '^IMAGE=' .env; then
              sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" .env
            else
              echo "IMAGE=$IMAGE" >> .env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
