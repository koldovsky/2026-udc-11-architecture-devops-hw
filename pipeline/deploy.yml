# GitHub запускає workflow лише з .github/workflows/. За умовою завдання файл лежить у pipeline/
# (docs/walkthrough.md, Task D) і в репо курсу не запускається; щоб увімкнути в робочому репо —
# скопіювати його в .github/workflows/deploy.yml.
name: CI / Deploy

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

# Мінімальні права за замовчуванням; job розширює лише потрібне (build: packages: write).
permissions:
  contents: read

jobs:

  # ─── 1. Тести ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

  # ─── 1б. Перевірка конфігу деплою (з кореня репо) ───────────────────────────
  # Детермінований перевіряльник tools/check-deploy.mjs, зокрема правило C5 з post-mortem
  # (action item #1): compose із змінною, яку застосунок не читає (як DB_POOL_SIZE у v1.8.0),
  # зупиняє pipeline тут — до збірки образу і деплою.
  deploy-checks:
    name: Deploy config checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm run test:tools

      - run: npm run check:deploy

  # ─── 2. Збірка й публікація образу ──────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: [test, deploy-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # пуш у GHCR через GITHUB_TOKEN
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # Єдине місце, де визначено тег деплою: його беруть і metadata-action, і job deploy.
      - id: tag
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest не пушимо — деплой завжди йде за явним sha-тегом.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ─── 3. Деплой (ручне схвалення через правило захисту environment) ───
  deploy:
    name: Deploy to production
    needs: build
    # На прод потрапляє лише тег релізу (push) або main (workflow_dispatch);
    # ручний запуск з іншої гілки тестує й збирає, але не деплоїть.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    # Деплой на прод, що вже йде, не скасовуємо; тести й збірки інших запусків ідуть паралельно.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # → Settings › Environments › production: додати required reviewers
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # metadata-action пушить назву образу в нижньому регістрі; стягуємо саме її.
      - name: Normalize image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # Усі секрети DEPLOY_* читаються тут один раз і стають ssh-аліасом `prod`;
      # далі — звичайні scp/ssh. DEPLOY_KNOWN_HOSTS — вивід `ssh-keyscan -p <port> <host>`,
      # один раз перевірений вручну: ключ хоста звіряється, а не приймається при першому з'єднанні.
      - name: Configure SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Скопіювати новий compose-файл на сервер ПОРУЧ із робочим (compose.yaml.new): робочий
      # compose.yaml замінюється лише в наступному кроці, після перевірки файлу і pull образу.
      - name: Upload compose file
        run: scp deploy/compose.yaml prod:/opt/poshtomat/compose.yaml.new

      # Стягнути новий образ і перестворити контейнери (короткий простій, поки compose їх перестворює).
      # GHCR_TOKEN — PAT з правом packages:read у секретах репо. Він іде у віддалений docker login
      # через stdin (не аргументом), тож не видний у списку процесів і в історії shell на сервері.
      # Порядок: перевірити compose.yaml.new (`config -q`) і стягнути образ → лише тоді зберегти
      # робочий файл як compose.yaml.prev і підмінити → `up --wait` чекає, поки api стане healthy
      # (HEALTHCHECK з образу; у worker перевірку вимкнено — для нього досить running). Не дочекались
      # за 120 с → повертаємо compose.yaml.prev і образ з .env, крок падає.
      # Лише ПІСЛЯ успішного `up --wait` IMAGE та IMAGE_TAG записуються в /opt/poshtomat/.env (решта
      # рядків — секрети, які веде адміністратор, — не чіпаються) і додається рядок у deploys.log.
      # Тож пізніші `docker compose …` у цій теці (runbook, відкат) працюють з тим самим проєктом
      # `poshtomat` і з образом, який справді запущено, а невдалий деплой не потрапляє в історію.
      # Потрібен Docker Compose v2 з `up --wait-timeout`; скрипт перевіряє це першим кроком.
      # Усе, що підставляється в текст віддаленої команди, спершу звіряється з суворим шаблоном:
      # назва тегу чи гілки, логін тощо можуть містити `$(…)`, `;` або лапки, а віддалений shell
      # розбирає рядок ще раз.
      - name: Pull image and restart services
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          check() { [[ "$2" =~ $3 ]] || { echo "::error::$1 має недозволені символи"; exit 1; }; }
          check IMAGE "$IMAGE" '^ghcr\.io/[a-z0-9._/-]+$'
          check IMAGE_TAG "$IMAGE_TAG" '^sha-[0-9a-f]{40}$'
          check GITHUB_REF_NAME "$GITHUB_REF_NAME" '^[A-Za-z0-9._/-]+$'
          check GITHUB_ACTOR "$GITHUB_ACTOR" '^[A-Za-z0-9-]+(\[bot\])?$'
          check GHCR_USER "$GHCR_USER" '^[A-Za-z0-9-]+$'
          check GITHUB_RUN_ID "$GITHUB_RUN_ID" '^[0-9]+$'
          printf '%s\n' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh prod "set -eu
            cd /opt/poshtomat
            docker compose up --help | grep -q -- --wait-timeout || {
              echo 'docker compose на VM не підтримує up --wait-timeout — оновіть Compose v2' >&2; exit 1; }
            export IMAGE='$IMAGE' IMAGE_TAG='$IMAGE_TAG'
            docker compose -f compose.yaml.new config -q
            docker compose -f compose.yaml.new pull --quiet api worker
            if [ -f compose.yaml ]; then cp compose.yaml compose.yaml.prev; fi
            mv compose.yaml.new compose.yaml
            if ! docker compose up -d --remove-orphans --no-build --wait --wait-timeout 120; then
              echo 'api не став healthy за 120 с — повертаю попередній compose.yaml і образ з .env' >&2
              if [ -f compose.yaml.prev ]; then mv compose.yaml.prev compose.yaml; fi
              unset IMAGE IMAGE_TAG
              docker compose up -d --remove-orphans --no-build || echo 'відкат не вдався — див. docs/runbook.md' >&2
              exit 1
            fi
            touch .env
            sed -i '/^IMAGE=/d; /^IMAGE_TAG=/d' .env
            printf 'IMAGE=%s\nIMAGE_TAG=%s\n' '$IMAGE' '$IMAGE_TAG' >> .env
            echo \"\$(date -Iseconds)   deploy    $GITHUB_REF_NAME   $GITHUB_ACTOR   image $IMAGE_TAG, run $GITHUB_RUN_ID\" >> deploys.log
            docker image prune -f"
