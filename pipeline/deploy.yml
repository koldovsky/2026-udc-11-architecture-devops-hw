name: CI / Deploy

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  # ─── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

  # ─── 2. Build & push image ──────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # push to GHCR via GITHUB_TOKEN
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ─── 3. Deploy (requires manual approval via environment protection rule) ───
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # → Settings › Environments › production: add required reviewers
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Push the latest compose file to the server.
      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: deploy/compose.yaml
          target: /opt/poshtomat
          strip_components: 1

      # Pull the new image and perform a zero-downtime restart.
      # GHCR_TOKEN is a PAT with packages:read scope, stored in repo secrets.
      # It is passed to the remote shell as an env var (never as a CLI arg)
      # so it does not appear in the remote process list or shell history.
      - name: Pull image and restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" --password-stdin

            cd /opt/poshtomat
            IMAGE="${{ env.IMAGE }}" IMAGE_TAG="${{ env.IMAGE_TAG }}" \
              docker compose pull --quiet api worker

            IMAGE="${{ env.IMAGE }}" IMAGE_TAG="${{ env.IMAGE_TAG }}" \
              docker compose up -d --remove-orphans --no-build

            docker image prune -f
