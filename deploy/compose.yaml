# Поштомат громади — продакшн на одній VM (docker compose up -d).
# PostgreSQL працює на самій VM, поза compose.
#
# Секрети зберігаються у .env поруч з цим файлом — НЕ в git.
# Обов'язкові змінні в .env:
#   IMAGE           — повний шлях до образу, напр. ghcr.io/your-org/poshtomat
#   DATABASE_URL    — рядок підключення до PostgreSQL з паролем
#   SMS_BASE_URL    — базовий URL SMS-шлюзу
#   SMS_TOKEN       — API-токен SMS-шлюзу
#   COURIER_BASE_URL— URL сервісу кур'єрів
#
# Запуск: IMAGE_TAG=sha-<commit> docker compose up -d

x-env: &env
  TZ: "Europe/Kyiv"
  LOG_LEVEL: "info"
  DB_POOL_MAX: "20"
  DB_POOL_WAIT_MS: "2000"
  SMS_RATE_PER_SEC: "20"

x-svc: &svc
  image: ${IMAGE}:${IMAGE_TAG:?IMAGE_TAG must be set — never deploy :latest}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 256M

services:
  api:
    <<: *svc
    ports:
      - "127.0.0.1:8080:8080"   # loopback only; reverse proxy listens on :443
    environment:
      <<: *env
      PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    <<: *svc
    command: ["node", "src/worker.js"]
    environment:
      <<: *env
