# Поштомат громади — продакшн на одній VM (docker compose up -d).
# PostgreSQL працює на самій VM, поза compose.
#
# Значення з оточення / файлу /opt/poshtomat/.env на VM (поза git):
#   IMAGE=ghcr.io/<owner>/<repo>:sha-<commit>    (CI оновлює при кожному деплої)
#   DATABASE_URL=postgres://poshtomat@192.0.2.10:5432/poshtomat
#   SMS_TOKEN=<токен провайдера>
#
# Назви змінних — рівно ті, що читає app/src/config.js (перевіряє правило E1 у
# tools/check-deploy.mjs; див. docs/postmortem.md — інцидент 2026-10-14).

# Спільні змінні. Підмішуються ВСЕРЕДИНУ environment: кожного сервісу —
# не на рівень сервісу: `<<:` неглибокий, і власний environment: сервісу
# повністю замінив би спільний.
x-env: &env
  TZ: "Europe/Kyiv"
  LOG_LEVEL: "info"
  DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in /opt/poshtomat/.env}"
  DB_POOL_MAX: "20"
  DB_POOL_WAIT_MS: "2000"
  SMS_BASE_URL: "https://sms.example.net/api/v2"
  SMS_TOKEN: "${SMS_TOKEN:?set SMS_TOKEN in /opt/poshtomat/.env}"
  # ліміт провайдера — 10/с (materials/vendors/sms-provider.md), лишаємо запас
  SMS_RATE_PER_SEC: "8"
  COURIER_BASE_URL: "https://courier.example.com/api/v1"

services:
  api:
    image: "${IMAGE:?set IMAGE, e.g. ghcr.io/owner/repo:sha-<commit>}"
    build:
      context: ../app
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *env
      PORT: "8080"
    # healthcheck — з HEALTHCHECK образу (deploy/Dockerfile)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  worker:
    image: "${IMAGE:?set IMAGE, e.g. ghcr.io/owner/repo:sha-<commit>}"
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *env
    # HTTP-сервера у worker немає: HTTP-перевірка з образу завжди падала б.
    # Живість worker-а видно з логів ("sms batch sent") і restart: unless-stopped.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

